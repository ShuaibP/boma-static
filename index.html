<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boma — Coming Soon</title>
  <meta name="description" content="Boma is coming soon. Be the first to know when we launch." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="coming-soon-page">

  <header class="nav-wrapper" id="nav">
    <nav class="nav-inner">
      <a href="#" class="nav-logo">boma</a>
      <a href="#notify" class="nav-cta">Notify Me</a>
    </nav>
  </header>

  <main class="coming-soon" id="hero">
    <div class="coming-soon-glow coming-soon-glow--one" aria-hidden="true"></div>
    <div class="coming-soon-glow coming-soon-glow--two" aria-hidden="true"></div>

    <div class="coming-soon-inner">
      <p class="brand-mark">boma</p>
      <span class="coming-badge fade-in delay-100">Coming Soon</span>
      <h1 class="fade-in delay-150">Something new is on the way.</h1>
      <p class="coming-sub fade-in delay-200">
        We’re putting the finishing touches on what’s next. Leave your email and we’ll let you know when we launch.
      </p>

      <form class="notify-form fade-in delay-300" id="signupForm" action="#" method="post">
        <div class="form-row" id="notify">
          <label class="sr-only" for="notifyEmail">Email address</label>
          <input id="notifyEmail" type="email" name="email" placeholder="Enter your email" required autocomplete="email" />
          <button type="submit" class="btn btn-primary">Notify Me</button>
        </div>
        <p class="form-note">No spam. Just a heads-up when we’re live.</p>
      </form>
    </div>
  </main>

  <footer class="footer footer--minimal">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Boma. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
